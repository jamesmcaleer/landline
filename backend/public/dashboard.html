<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landline dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr 380px; background: #0d1117; color: #c9d1d9; font: 13px/1.4 ui-monospace, Menlo, monospace; }
  #list { border-right: 1px solid #30363d; overflow-y: auto; }
  #list h1 { font-size: 13px; margin: 0; padding: 12px; color: #8b949e; border-bottom: 1px solid #30363d; }
  .row { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #21262d; }
  .row:hover { background: #161b22; }
  .row.sel { background: #1f2937; border-left: 3px solid #58a6ff; padding-left: 9px; }
  .row .dom { color: #e6edf3; font-weight: bold; }
  .row .meta { color: #8b949e; font-size: 12px; }
  .st-working { color: #58a6ff; } .st-idle { color: #3fb950; } .st-waiting_approval { color: #d29922; } .st-waiting_user { color: #d29922; }
  #main { display: flex; flex-direction: column; min-width: 0; padding: 12px; gap: 10px; }
  #head { display: flex; align-items: center; gap: 10px; min-height: 24px; }
  #head img { width: 18px; height: 18px; }
  #head .dom { font-size: 15px; color: #e6edf3; font-weight: bold; }
  #head .meta { color: #8b949e; }
  #view { flex: 1; min-height: 0; background: #010409; border: 1px solid #30363d; display: flex; align-items: center; justify-content: center; color: #8b949e; }
  #view img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #q { display: flex; gap: 8px; }
  #q input { flex: 1; background: #010409; color: #e6edf3; border: 1px solid #30363d; padding: 8px; font: inherit; }
  button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #30363d; }
  #stop { color: #f85149; }
  #qmsg { color: #d29922; min-height: 16px; }
  #side { border-left: 1px solid #30363d; display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 10px 12px; border-bottom: 1px solid #30363d; color: #8b949e; }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .ev { padding: 3px 0; word-break: break-word; }
  .ev .t, .ev .d { color: #8b949e; margin-right: 6px; }
  .ev.err { color: #f85149; }
  .ev.note { color: #8b949e; }
  .done { display: block; margin-top: 3px; padding: 8px; background: #12261a; border-left: 3px solid #3fb950; color: #e6edf3; white-space: pre-wrap; }
  a { color: #58a6ff; }
</style>
</head>
<body>
<div id="list"><h1>CONNECTIONS</h1><div id="rows"></div></div>
<div id="main">
  <div id="head"></div>
  <div id="view">no frames yet</div>
  <div id="qmsg"></div>
  <form id="q"><input id="qi" placeholder="Ask the agent to do something..." autocomplete="off"><button type="submit">Send</button><button type="button" id="stop">Stop</button></form>
</div>
<div id="side">
  <header>EVENT LOG <label style="float:right"><input type="checkbox" id="only" checked> only selected</label></header>
  <div id="log"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let conns = [], selected = null, stick = true;
const frames = {}, events = [];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const domainOf = (id) => (conns.find((c) => c.id === id)?.site.domain) || id;

async function refresh() {
  try {
    const r = await fetch("/connections");
    conns = (await r.json()).connections;
  } catch { return; }
  if (!conns.some((c) => c.id === selected)) selected = conns[0]?.id ?? null;
  renderList(); renderHead(); renderView(); renderLog();
}

function renderList() {
  $("rows").innerHTML = conns.map((c) => `<div class="row ${c.id === selected ? "sel" : ""}" data-id="${esc(c.id)}">
    <div class="dom">${esc(c.site.domain)}</div>
    <div class="meta"><span class="st-${esc(c.state)}">${esc(c.state)}</span> &middot; ${c.loggedIn === true ? "logged in" : c.loggedIn === false ? "logged out" : "login unknown"}</div></div>`).join("")
    || '<div class="row meta">no connections</div>';
}

function renderHead() {
  const c = conns.find((x) => x.id === selected);
  $("head").innerHTML = c ? `${c.site.favIconUrl ? `<img src="${esc(c.site.favIconUrl)}" alt="">` : ""}<span class="dom">${esc(c.site.domain)}</span>
    <span class="st-${esc(c.state)}">${esc(c.state)}</span><span class="meta">created ${esc(c.createdAt)}</span>` : "";
}

function renderView() {
  const f = frames[selected];
  const img = $("view").querySelector("img");
  if (!f) { $("view").textContent = "no frames yet"; return; }
  if (img) img.src = "data:image/jpeg;base64," + f;
  else { $("view").innerHTML = ""; const i = document.createElement("img"); i.src = "data:image/jpeg;base64," + f; $("view").appendChild(i); }
}

function lineHtml(env) {
  const e = env.event, d = new Date(env.ts);
  const time = d.toTimeString().slice(0, 8);
  const head = `<span class="t">${time}</span><span class="d">${esc(domainOf(e.connectionId))}</span>`;
  switch (e.type) {
    case "task.step": return `<div class="ev">${head}${esc(e.text)}</div>`;
    case "task.done": return `<div class="ev">${head}done<span class="done">${esc(e.text)}</span></div>`;
    case "task.error": return `<div class="ev err">${head}error: ${esc(e.text)}</div>`;
    case "approval.requested": return `<div class="ev">${head}approval needed: ${esc(e.summary)} <a href="${esc(e.url)}" target="_blank" rel="noopener">open</a> <button data-copy="${esc(e.url)}">copy link</button></div>`;
    case "approval.resolved": return `<div class="ev">${head}approval ${esc(e.status)}${e.message ? ": " + esc(e.message) : ""}</div>`;
    case "connection.created": return `<div class="ev note">${head}connection created</div>`;
    case "connection.ready": return `<div class="ev note">${head}connection ready (logged in: ${e.loggedIn})</div>`;
    case "connection.removed": return `<div class="ev note">${head}connection removed</div>`;
    default: return `<div class="ev note">${head}${esc(e.type)}</div>`;
  }
}

function visible(env) { return !$("only").checked || env.event.connectionId === selected; }
function renderLog() {
  $("log").innerHTML = events.filter(visible).map(lineHtml).join("");
  if (stick) $("log").scrollTop = $("log").scrollHeight;
}
function appendLog(env) {
  if (!visible(env)) return;
  $("log").insertAdjacentHTML("beforeend", lineHtml(env));
  if (stick) $("log").scrollTop = $("log").scrollHeight;
}

$("log").addEventListener("scroll", () => { const l = $("log"); stick = l.scrollHeight - l.scrollTop - l.clientHeight < 30; });
$("log").addEventListener("click", (ev) => {
  const url = ev.target.dataset?.copy;
  if (!url) return;
  (navigator.clipboard?.writeText(url) ?? Promise.reject()).catch(() => prompt("Copy link", url));
  ev.target.textContent = "copied";
});
$("only").addEventListener("change", renderLog);
$("rows").addEventListener("click", (ev) => {
  const row = ev.target.closest(".row[data-id]");
  if (!row) return;
  selected = row.dataset.id; $("qmsg").textContent = "";
  renderList(); renderHead(); renderView(); renderLog();
});

$("q").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const query = $("qi").value.trim();
  if (!query || !selected) return;
  const res = await fetch("/actions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ connectionId: selected, query }) });
  if (res.status === 202) { $("qi").value = ""; $("qmsg").textContent = ""; }
  else if (res.status === 409) $("qmsg").textContent = "busy: an action is already running";
  else $("qmsg").textContent = "error " + res.status;
  refresh();
});
$("stop").addEventListener("click", async () => {
  if (!selected) return;
  await fetch("/actions/stop", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ connectionId: selected }) });
  refresh();
});

let delay = 500;
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/dashboard?since=0");
  ws.onopen = () => { delay = 500; events.length = 0; };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "frame") {
      frames[msg.connectionId] = msg.jpeg;
      if (msg.connectionId === selected) renderView();
      return;
    }
    events.push(msg);
    appendLog(msg);
    if (msg.event.type.startsWith("connection.") || msg.event.type.startsWith("approval.") || msg.event.type.startsWith("task.")) refresh();
  };
  ws.onclose = () => { setTimeout(connect, delay); delay = Math.min(delay * 2, 10000); };
  ws.onerror = () => ws.close();
}

refresh(); setInterval(refresh, 5000); connect();
</script>
</body>
</html>
