<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Soft color blobs behind the glass, per design C. -->
    <div class="blobs" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
    </div>

    <div class="shell">
      <header class="bar">
        <span class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
          </span>
          <span class="brand-name">Landline</span>
        </span>
        <button class="x-btn l-ghost accounts-btn" id="accounts-btn" hidden>
          Accounts <span class="count-pill" id="count-pill">0</span>
        </button>
      </header>

      <main class="body" id="body"><!-- screens render here --></main>

      <footer class="foot" id="foot">
        <span class="foot-label">Text</span>
        <span class="foot-number" id="foot-number">(617) 555-0142</span>
        <button class="x-btn l-ghost copy-btn" id="copy-btn" aria-label="Copy number">
          <svg class="copy-idle" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg>
          <svg class="copy-done" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1f8a42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
